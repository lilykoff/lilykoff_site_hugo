baseURL = "http://lilykoff.com/"
defaultContentLanguage = "en"
languageCode = "en"


title = "Lily Koffman, PhD"
theme = "gokarna"

[contentFormats]
  [contentFormats.html]
    mediaType = "text/html"
    isPlainText = false

[markup.goldmark.renderer]
  unsafe = true


# Automatically generate robots.txt
enableRobotsTXT = true
[params]
  avatarURL = "/images/headshot_new.jpeg"
  avatarSize = "size-xl"

  # Description to display on homepage
  description = "Biostatistician & data scientist<br>Assistant Professor in the University of Virginia <a href='https://datascience.virginia.edu/'>School of Data Science</a>"

  # Accent color is displayed when you hover over <a> tags
  accentColor = "#66E5FF"

  # Display "back to top" button on posts
  ShowBackToTopButton = true

  # You can use this to inject any HTML in the <head> tag.
  # Ideal usecase for this is to import custom js/css or add your analytics snippet
  customHeadHTML = """
  <style>
    .home-about h1,
    .home-about h3 {
      text-align: center;
    }

    .centered-text {
      text-align: center;
      max-width: 700px;
      margin: 2rem auto;
      line-height: 1.6;
    }
    .centered-text p {
      margin-bottom: 1rem;
    }
  </style>
  """
  metaKeywords = ["biostatistics", "wearables", "wearable devices", "accelerometry"]

  
  # Footer text
  footer = ""
  socialIcons = [
    {name = "linkedin", url = "https://linkedin.com/in/lily-koffman"},
   #  {name = "github", url = "https://github.com/lilykoff"},
    {name = "email", url = "mailto:koffman@virginia.edu"},
    {name = "googlescholar", url = "https://scholar.google.com/citations?user=lOh2k5YAAAAJ&hl=en"},
    {name = "orcid", url = "https://orcid.org/0000-0003-1543-2896"},
    {name = "researchgate", url = "https://www.researchgate.net/profile/Lily-Koffman"},
   #{name = "medium", url = "https://medium.com/@lilykoffman"},
    {name = "strava", url = "https://www.strava.com/athletes/27249108"}
  ]
